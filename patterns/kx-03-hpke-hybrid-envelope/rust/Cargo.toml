[package]
name = "kx-03-hpke-hybrid-envelope"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# hpke-rs with the libcrux provider: formally verified ML-KEM and X25519, and
# the X-Wing KEM at code point 0x647a (draft-ietf-hpke-pq).
hpke-rs = "0.8"
hpke-rs-crypto = "0.8"
hpke-rs-libcrux = { version = "0.8", features = ["draft-ietf-hpke-pq"] }

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
