[package]
name = "pki-01-mldsa-certificates"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "aws_lc_rs_unstable", "pem"] }
rustls = { version = "0.23.31", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "logging"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
